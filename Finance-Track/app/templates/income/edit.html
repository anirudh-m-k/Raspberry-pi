{% extends "base.html" %}

{% block title %}Edit Income - FinanceTrack{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="/income" class="text-sm text-primary-600 hover:text-primary-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Income
        </a>
    </div>

    <div class="card p-6 sm:p-8">
        <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-6">Edit Income</h1>

        <form id="income-form" onsubmit="handleSubmit(event)" class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Amount *</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                        <input type="number" name="amount" step="0.01" min="0.01" required placeholder="0.00" class="input-field pl-8 text-lg font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Date *</label>
                    <input type="date" name="date" required class="input-field">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Source</label>
                    <input type="text" name="source" placeholder="e.g., Company Name, Client" class="input-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Category</label>
                    <select name="category_id" class="input-field">
                        <option value="">Select Category</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Payment Method *</label>
                    <select name="payment_method" required class="input-field">
                        <option value="Cash">Cash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="UPI">UPI</option>
                        <option value="Cheque">Cheque</option>
                        <option value="Wallet">Wallet</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Account</label>
                    <select name="account_id" class="input-field">
                        <option value="">Select Account (Optional)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Notes</label>
                <textarea name="notes" rows="3" placeholder="Add any notes..." class="input-field"></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <a href="/income" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">
                    <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Update Income
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let incomeId = window.location.pathname.split('/')[2];

document.addEventListener('DOMContentLoaded', async function() {
    setPageTitle('Edit Income');
    await Promise.all([loadCategories(), loadAccounts()]);
    await loadIncome();
});

async function loadCategories() {
    try {
        const result = await api.get('/settings/categories', { type: 'income' });
        const select = document.querySelector('select[name="category_id"]');
        result.data.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.name;
            select.appendChild(opt);
        });
    } catch (e) {
        console.error('Failed to load categories:', e);
    }
}

async function loadAccounts() {
    try {
        const result = await api.get('/accounts');
        const select = document.querySelector('select[name="account_id"]');
        result.data.forEach(acc => {
            const opt = document.createElement('option');
            opt.value = acc.id;
            opt.textContent = `${acc.name} (${formatCurrency(acc.balance)})`;
            select.appendChild(opt);
        });
    } catch (e) {
        console.error('Failed to load accounts:', e);
    }
}

async function loadIncome() {
    try {
        const result = await api.get(`/income/${incomeId}`);
        const income = result.data;
        const form = document.getElementById('income-form');

        form.amount.value = income.amount;
        form.date.value = income.date;
        form.source.value = income.source || '';
        form.payment_method.value = income.payment_method;
        form.notes.value = income.notes || '';

        if (income.category_id) form.category_id.value = income.category_id;
        if (income.account_id) form.account_id.value = income.account_id;
    } catch (e) {
        showFlash('Failed to load income', 'error');
        setTimeout(() => window.location.href = '/income', 1000);
    }
}

async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = '<svg class="w-4 h-4 inline-block mr-2 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Updating...';

    try {
        const data = {
            amount: parseFloat(form.amount.value),
            date: form.date.value,
            source: form.source.value || null,
            category_id: form.category_id.value || null,
            payment_method: form.payment_method.value,
            account_id: form.account_id.value || null,
            notes: form.notes.value || null,
        };

        await api.put(`/income/${incomeId}`, data);
        showFlash('Income updated successfully!', 'success');
        setTimeout(() => window.location.href = '/income', 500);
    } catch (error) {
        const message = error.error?.message || 'Failed to update income';
        showFlash(message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}
</script>
{% endblock %}
