{% extends "base.html" %}

{% block title %}Create Savings Pot - FinanceTrack{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="/savings-pots" class="text-sm text-primary-600 hover:text-primary-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Savings Pots
        </a>
    </div>

    <div class="card p-6 sm:p-8">
        <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-6">Create Savings Pot</h1>

        <form onsubmit="handleSubmit(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Pot Name *</label>
                <input type="text" name="name" required placeholder="e.g., Emergency Fund, Vacation" class="input-field">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Description</label>
                <textarea name="description" rows="3" placeholder="What is this pot for?" class="input-field"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Planned Amount <span class="text-gray-400 font-normal">(optional)</span></label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                    <input type="number" name="target_amount" step="0.01" min="0.01" placeholder="e.g., 5000 — how much you plan to save" class="input-field pl-8">
                </div>
                <p class="text-xs text-gray-500 mt-1">How much you intend to save in this pot. Visible on hover as a quick reminder.</p>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <a href="/savings-pots" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">
                    <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Create Pot
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    setPageTitle('Create Savings Pot');
});

async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;

    try {
        const payload = {
            name: form.name.value.trim(),
            description: form.description.value || null,
        };
        const ta = form.target_amount.value.trim();
        if (ta) payload.target_amount = parseFloat(ta);
        await api.post('/savings-pots', payload);
        showFlash('Savings pot created!', 'success');
        setTimeout(() => window.location.href = '/savings-pots', 500);
    } catch (error) {
        showFlash(error.error?.message || 'Failed to create', 'error');
    }
}
</script>
{% endblock %}
