{% extends "admin/base.html" %}

{% block title %}User Details - Admin{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="mb-6">
        <a href="/admin/users" class="text-sm text-primary-600 hover:text-primary-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Back to Users
        </a>
    </div>

    <!-- Profile Card -->
    <div class="card p-6">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 rounded-full bg-primary-100 dark:bg-primary-900/20 flex items-center justify-center">
                <span id="user-avatar" class="text-2xl font-bold text-primary-600"></span>
            </div>
            <div>
                <h1 id="user-name" class="text-xl font-bold text-gray-900 dark:text-white"></h1>
                <p id="user-email" class="text-sm text-gray-600 dark:text-gray-400"></p>
                <div id="user-badges" class="flex items-center gap-2 mt-1"></div>
            </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="p-3 rounded-lg bg-gray-50 dark:bg-surface-dark">
                <p class="text-xs text-gray-500">Registered</p>
                <p id="user-created" class="text-sm font-medium text-gray-900 dark:text-white mt-1"></p>
            </div>
            <div class="p-3 rounded-lg bg-gray-50 dark:bg-surface-dark">
                <p class="text-xs text-gray-500">Last Login</p>
                <p id="user-last-login" class="text-sm font-medium text-gray-900 dark:text-white mt-1"></p>
            </div>
            <div class="p-3 rounded-lg bg-gray-50 dark:bg-surface-dark">
                <p class="text-xs text-gray-500">Accounts</p>
                <p id="user-accounts" class="text-sm font-medium text-gray-900 dark:text-white mt-1"></p>
            </div>
            <div class="p-3 rounded-lg bg-gray-50 dark:bg-surface-dark">
                <p class="text-xs text-gray-500">Goals</p>
                <p id="user-goals" class="text-sm font-medium text-gray-900 dark:text-white mt-1"></p>
            </div>
        </div>
    </div>

    <!-- Recent Activity -->
    <div class="card overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Recent Activity</h2>
        </div>
        <div id="activity-list"></div>
    </div>
</div>

<script>
const userId = window.location.pathname.split('/').pop();

document.addEventListener('DOMContentLoaded', function() {
    loadUser();
});

async function loadUser() {
    try {
        const result = await api.get(`/admin/users/${userId}`);
        const data = result.data;
        const user = data.user;

        document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-created').textContent = formatDateTime(user.created_at);
        document.getElementById('user-last-login').textContent = user.last_login ? formatDateTime(user.last_login) : 'Never';
        document.getElementById('user-accounts').textContent = data.counts.accounts;
        document.getElementById('user-goals').textContent = data.counts.goals;

        const badges = document.getElementById('user-badges');
        let badgeHtml = '';
        if (user.role === 'admin') {
            badgeHtml += '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 dark:bg-red-900/20 text-red-800 dark:text-red-400">Admin</span>';
        }
        badgeHtml += user.is_active
            ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 dark:bg-green-900/20 text-green-800 dark:text-green-400">Active</span>'
            : '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 dark:bg-red-900/20 text-red-800 dark:text-red-400">Inactive</span>';
        badgeHtml += user.is_verified
            ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 dark:bg-blue-900/20 text-blue-800 dark:text-blue-400">Verified</span>'
            : '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 dark:bg-yellow-900/20 text-yellow-800 dark:text-yellow-400">Unverified</span>';
        badges.innerHTML = badgeHtml;

        renderActivity(data.recent_activity);
    } catch (e) {
        showFlash('Failed to load user', 'error');
    }
}

function renderActivity(logs) {
    const container = document.getElementById('activity-list');
    if (logs.length === 0) {
        container.innerHTML = '<p class="px-6 py-8 text-center text-gray-500">No recent activity</p>';
        return;
    }

    container.innerHTML = logs.map(log => `
        <div class="flex items-start gap-4 px-6 py-4 border-b border-gray-100 dark:border-gray-800">
            <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-surface-dark flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm text-gray-900 dark:text-white">${escapeHtml(log.action.replace(/_/g, ' '))}</p>
                ${log.details ? `<p class="text-xs text-gray-500 mt-0.5">${escapeHtml(log.details)}</p>` : ''}
                <p class="text-xs text-gray-400 mt-1">${formatDateTime(log.created_at)}${log.ip_address ? ' • IP: ' + escapeHtml(log.ip_address) : ''}</p>
            </div>
        </div>
    `).join('');
}
</script>
{% endblock %}
