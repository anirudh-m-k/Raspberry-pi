{% extends "admin/base.html" %}

{% block title %}Users - Admin{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Users</h1>
            <p class="text-gray-600 dark:text-gray-400 text-sm">Manage registered users</p>
        </div>
        <div class="flex items-center gap-3">
            <input type="text" id="search-input" placeholder="Search name or email..." class="input-field w-64" oninput="debounce(loadUsers, 300)()">
            <select id="status-filter" class="input-field w-32" onchange="loadUsers()">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
    </div>

    <div class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="border-b border-gray-200 dark:border-gray-700">
                        <th class="text-left px-6 py-3 text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Name</th>
                        <th class="text-left px-6 py-3 text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Email</th>
                        <th class="text-left px-6 py-3 text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Role</th>
                        <th class="text-left px-6 py-3 text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Status</th>
                        <th class="text-left px-6 py-3 text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Registered</th>
                        <th class="text-left px-6 py-3 text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Last Login</th>
                        <th class="text-right px-6 py-3 text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-list"></tbody>
            </table>
        </div>
        <div id="users-pagination" class="px-6 py-4 border-t border-gray-200 dark:border-gray-700"></div>
    </div>
</div>

{% include 'components/modal.html' %}

<script>
let currentPage = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadUsers();
});

async function loadUsers(page = 1) {
    currentPage = page;
    const params = {
        page: page,
        per_page: 20,
        search: document.getElementById('search-input').value,
        status: document.getElementById('status-filter').value,
    };
    Object.keys(params).forEach(k => { if (!params[k]) delete params[k]; });

    try {
        const result = await api.get('/admin/users', params);
        renderUsers(result.data);
        renderPagination(result.pagination, loadUsers);
    } catch (e) {
        showFlash('Failed to load users', 'error');
    }
}

function renderUsers(users) {
    const tbody = document.getElementById('users-list');
    if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">No users found</td></tr>';
        return;
    }

    tbody.innerHTML = users.map(u => `
        <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-surface-dark-hover">
            <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-primary-100 dark:bg-primary-900/20 flex items-center justify-center">
                        <span class="text-sm font-medium text-primary-600">${escapeHtml(u.name).charAt(0).toUpperCase()}</span>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-900 dark:text-white">${escapeHtml(u.name)}</p>
                    </div>
                </div>
            </td>
            <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${escapeHtml(u.email)}</td>
            <td class="px-6 py-4">
                ${u.role === 'admin'
                    ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-purple-100 dark:bg-purple-900/20 text-purple-800 dark:text-purple-400">Admin</span>'
                    : '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200">User</span>'}
            </td>
            <td class="px-6 py-4">
                ${u.is_active
                    ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 dark:bg-green-900/20 text-green-800 dark:text-green-400">Active</span>'
                    : '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 dark:bg-red-900/20 text-red-800 dark:text-red-400">Inactive</span>'}
            </td>
            <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${formatDateTime(u.created_at)}</td>
            <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${u.last_login ? formatDateTime(u.last_login) : 'Never'}</td>
            <td class="px-6 py-4 text-right">
                <div class="flex items-center justify-end gap-2">
                    <a href="/admin/users/${u.id}" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="View">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </a>
                    <button onclick="changeRole('${u.id}', '${escapeHtml(u.name)}', '${u.role}')" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="Change Role">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </button>
                    <button onclick="toggleStatus('${u.id}', ${!u.is_active})" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="${u.is_active ? 'Deactivate' : 'Activate'}">
                        ${u.is_active
                            ? '<svg class="w-4 h-4 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>'
                            : '<svg class="w-4 h-4 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'}
                    </button>
                    <button onclick="deleteUser('${u.id}', '${escapeHtml(u.name)}')" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/20" title="Delete User">
                        <svg class="w-4 h-4 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </td>
        </tr>
    `).join('');
}

function renderPagination(pagination, callback) {
    const container = document.getElementById('users-pagination');
    if (pagination.pages <= 1) {
        container.innerHTML = '';
        return;
    }

    let html = '<div class="flex items-center justify-between">';
    html += `<p class="text-sm text-gray-600 dark:text-gray-400">Showing ${(pagination.page - 1) * pagination.per_page + 1} to ${Math.min(pagination.page * pagination.per_page, pagination.total)} of ${pagination.total}</p>`;
    html += '<div class="flex items-center gap-1">';

    if (pagination.page > 1) {
        html += `<button onclick="(${callback.name})(${pagination.page - 1})" class="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover">Previous</button>`;
    }
    if (pagination.page < pagination.pages) {
        html += `<button onclick="(${callback.name})(${pagination.page + 1})" class="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover">Next</button>`;
    }

    html += '</div></div>';
    container.innerHTML = html;
}

async function toggleStatus(userId, newStatus) {
    const action = newStatus ? 'activate' : 'deactivate';
    confirmAction(`Are you sure you want to ${action} this user?`, async () => {
        try {
            await api.put(`/admin/users/${userId}/status`, { is_active: newStatus });
            showFlash(`User ${action}d successfully`, 'success');
            loadUsers(currentPage);
        } catch (e) {
            showFlash(e.error?.message || 'Failed to update status', 'error');
        }
    });
}

function deleteUser(userId, userName) {
    openModal('Delete User', `
        <p class="text-gray-600 dark:text-gray-400 mb-4">Are you sure you want to delete <strong>${escapeHtml(userName)}</strong>? This will permanently delete all their data (expenses, income, goals, accounts, etc.).</p>
        <form onsubmit="confirmDeleteUser(event, '${userId}')" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Enter your admin password to confirm</label>
                <input type="password" name="password" required placeholder="Admin password" class="input-field">
            </div>
            <div class="flex items-center justify-end gap-3">
                <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-danger">Delete User</button>
            </div>
        </form>
    `);
}

async function confirmDeleteUser(e, userId) {
    e.preventDefault();
    const password = e.target.password.value;

    try {
        await api.delete(`/admin/users/${userId}`, { password });
        closeModal();
        showFlash('User deleted successfully', 'success');
        loadUsers(currentPage);
    } catch (err) {
        showFlash(err.error?.message || 'Failed to delete user', 'error');
    }
}

function changeRole(userId, userName, currentRole) {
    const newRole = currentRole === 'admin' ? 'user' : 'admin';
    const newRoleLabel = newRole.charAt(0).toUpperCase() + newRole.slice(1);

    openModal('Change User Role', `
        <p class="text-gray-600 dark:text-gray-400 mb-4">Change <strong>${escapeHtml(userName)}</strong>'s role from <strong>${currentRole}</strong> to <strong>${newRoleLabel}</strong>?</p>
        ${newRole === 'user' ? '<p class="text-sm text-yellow-600 dark:text-yellow-400 mb-4">Warning: This user will lose access to the admin panel.</p>' : ''}
        <div class="flex items-center justify-end gap-3">
            <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
            <button type="button" onclick="confirmChangeRole('${userId}', '${newRole}')" class="btn-primary">Change to ${newRoleLabel}</button>
        </div>
    `);
}

async function confirmChangeRole(userId, newRole) {
    try {
        await api.put(`/admin/users/${userId}/role`, { role: newRole });
        closeModal();
        showFlash(`User role changed to ${newRole}`, 'success');
        loadUsers(currentPage);
    } catch (err) {
        showFlash(err.error?.message || 'Failed to change role', 'error');
    }
}
</script>
{% endblock %}
