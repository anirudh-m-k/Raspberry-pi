{% extends "base.html" %}

{% block title %}Edit Account - FinanceTrack{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="/accounts" class="text-sm text-primary-600 hover:text-primary-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Accounts
        </a>
    </div>

    <div class="card p-6 sm:p-8">
        <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-6">Edit Account</h1>

        <form onsubmit="handleSubmit(event)" class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Account Name *</label>
                    <input type="text" name="name" required class="input-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Account Type *</label>
                    <select name="type" required class="input-field">
                        <option value="bank">Bank Account</option>
                        <option value="cash">Cash</option>
                        <option value="credit_card">Credit Card</option>
                        <option value="upi">UPI</option>
                        <option value="wallet">Wallet</option>
                        <option value="investment">Investment</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Current Balance</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                        <input type="number" name="balance" step="0.01" class="input-field pl-8">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Currency</label>
                    <select name="currency" class="input-field">
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Institution / Bank Name</label>
                <input type="text" name="institution" class="input-field">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Notes</label>
                <textarea name="notes" rows="3" class="input-field"></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <a href="/accounts" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">
                    <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Update Account
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let accountId = window.location.pathname.split('/')[2];

document.addEventListener('DOMContentLoaded', async function() {
    setPageTitle('Edit Account');
    await loadAccount();
});

async function loadAccount() {
    try {
        const result = await api.get(`/accounts/${accountId}`);
        const account = result.data;
        const form = document.querySelector('form');
        form.name.value = account.name;
        form.type.value = account.type;
        form.balance.value = account.balance;
        form.currency.value = account.currency || 'INR';
        form.institution.value = account.institution || '';
        form.notes.value = account.notes || '';
    } catch (e) {
        showFlash('Failed to load account', 'error');
        setTimeout(() => window.location.href = '/accounts', 1000);
    }
}

async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = 'Updating...';

    try {
        await api.put(`/accounts/${accountId}`, {
            name: form.name.value.trim(),
            type: form.type.value,
            balance: parseFloat(form.balance.value),
            currency: form.currency.value,
            institution: form.institution.value || null,
            notes: form.notes.value || null,
        });
        showFlash('Account updated!', 'success');
        setTimeout(() => window.location.href = '/accounts', 500);
    } catch (error) {
        showFlash(error.error?.message || 'Failed to update', 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}
</script>
{% endblock %}
