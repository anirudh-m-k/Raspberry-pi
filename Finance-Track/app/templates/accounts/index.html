{% extends "base.html" %}

{% block title %}Accounts - FinanceTrack{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Accounts</h1>
            <p class="text-gray-600 dark:text-gray-400 text-sm">Manage your bank accounts, wallets, and cards</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="showTransferModal()" class="btn-secondary">
                <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                </svg>
                Transfer
            </button>
            <a href="/accounts/add" class="btn-primary">
                <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add Account
            </a>
        </div>
    </div>

    <!-- Total Balance Card -->
    <div class="card p-6 bg-gradient-to-r from-primary-600 to-primary-700 border-primary-800">
        <div class="flex items-start justify-between">
            <div>
                <p class="text-primary-100 text-sm">Total Balance</p>
                <p id="total-balance" class="text-3xl font-bold text-white mt-1">₹0.00</p>
            </div>
            <button data-eye-id="acc_total" onclick="toggleCardVisibility(this)" class="eye-btn p-1 rounded hover:bg-white/10" title="Toggle visibility">
                <svg class="eye-open w-5 h-5 text-white/70 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                <svg class="eye-closed w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
        </div>
    </div>

    <!-- Accounts Grid -->
    <div id="accounts-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
    </div>

    {% include 'components/empty_state.html' %}
</div>

{% include 'components/modal.html' %}

<script>
let accountsData = [];

document.addEventListener('DOMContentLoaded', function() {
    setPageTitle('Accounts');
    loadAccounts();
});

async function loadAccounts() {
    try {
        const result = await api.get('/accounts');
        accountsData = result.data;
        renderAccounts();

        const total = accountsData.reduce((sum, acc) => sum + acc.balance, 0);
        document.getElementById('total-balance').textContent = formatCurrency(total);
        document.getElementById('total-balance').dataset.original = formatCurrency(total);

        // Apply eye button state after rendering dynamic cards
        initAmountVisibility();

        if (accountsData.length === 0) {
            showEmptyState('No accounts yet', 'Add your bank accounts, wallets, and cards to track balances.', 'Add Account', '/accounts/add');
        } else {
            hideEmptyState();
        }
    } catch (e) {
        showFlash('Failed to load accounts', 'error');
    }
}

function renderAccounts() {
    const grid = document.getElementById('accounts-grid');
    const typeIcons = {
        cash: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>',
        bank: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>',
        credit_card: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>',
        upi: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>',
        wallet: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>',
        investment: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>',
    };
    const typeColors = {
        cash: 'bg-green-100 dark:bg-green-900/20 text-green-600 dark:text-green-400',
        bank: 'bg-blue-100 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400',
        credit_card: 'bg-purple-100 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400',
        upi: 'bg-orange-100 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400',
        wallet: 'bg-yellow-100 dark:bg-yellow-900/20 text-yellow-600 dark:text-yellow-400',
        investment: 'bg-indigo-100 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400',
    };

    grid.innerHTML = accountsData.map(acc => `
        <div class="card-hover p-5">
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center ${typeColors[acc.type] || 'bg-gray-100 dark:bg-gray-800 text-gray-600'}">
                        ${typeIcons[acc.type] || typeIcons.bank}
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-900 dark:text-white">${escapeHtml(acc.name)}</h3>
                        <p class="text-xs text-gray-500 capitalize">${escapeHtml(acc.type).replace('_', ' ')}</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <a href="/accounts/${acc.id}" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="View">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </a>
                    <a href="/accounts/${acc.id}/edit" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="Edit">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                    </a>
                    <button onclick="deleteAccount(${acc.id})" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/20" title="Delete">
                        <svg class="w-4 h-4 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <p class="text-2xl font-bold ${acc.balance >= 0 ? 'text-gray-900 dark:text-white' : 'text-danger'}">${formatCurrency(acc.balance)}</p>
                <button data-eye-id="acc_${acc.id}" onclick="toggleCardVisibility(this)" class="eye-btn p-1 rounded hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="Toggle visibility">
                    <svg class="eye-open w-4 h-4 text-gray-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <svg class="eye-closed w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                </button>
            </div>
            ${acc.institution ? `<p class="text-xs text-gray-500 mt-1">${acc.institution}</p>` : ''}
        </div>
    `).join('');
}

function showTransferModal() {
    const accountOptions = accountsData.map(acc =>
        `<option value="${acc.id}">${acc.name} (${formatCurrency(acc.balance)})</option>`
    ).join('');

    openModal('Transfer Between Accounts', `
        <form onsubmit="handleTransfer(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">From Account</label>
                <select name="from_account_id" required class="input-field">
                    <option value="">Select source account</option>
                    ${accountOptions}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">To Account</label>
                <select name="to_account_id" required class="input-field">
                    <option value="">Select destination account</option>
                    ${accountOptions}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Amount</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                    <input type="number" name="amount" step="0.01" min="0.01" required placeholder="0.00" class="input-field pl-8">
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 pt-4">
                <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Transfer</button>
            </div>
        </form>
    `);
}

async function handleTransfer(e) {
    e.preventDefault();
    const form = e.target;

    try {
        await api.post('/accounts/transfer', {
            from_account_id: parseInt(form.from_account_id.value),
            to_account_id: parseInt(form.to_account_id.value),
            amount: parseFloat(form.amount.value),
        });
        closeModal();
        showFlash('Transfer successful!', 'success');
        loadAccounts();
    } catch (error) {
        showFlash(error.error?.message || 'Transfer failed', 'error');
    }
}

async function deleteAccount(id) {
    confirmAction('Are you sure you want to delete this account?', async () => {
        try {
            await api.delete(`/accounts/${id}`);
            showFlash('Account deleted', 'success');
            loadAccounts();
        } catch (e) {
            showFlash('Failed to delete account', 'error');
        }
    });
}
</script>
{% endblock %}
