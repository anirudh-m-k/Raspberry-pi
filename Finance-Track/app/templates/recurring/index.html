{% extends "base.html" %}

{% block title %}Recurring Transactions - FinanceTrack{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Recurring Transactions</h1>
            <p class="text-gray-600 dark:text-gray-400 text-sm">Automate your recurring expenses and income</p>
        </div>
        <a href="/recurring/add" class="btn-primary">
            <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Recurring
        </a>
    </div>

    <!-- Tabs -->
    <div class="flex items-center gap-2 border-b border-gray-200 dark:border-gray-700">
        <button onclick="filterType('')" class="tab-btn active px-4 py-2 text-sm font-medium border-b-2 border-primary-600 text-primary-600">All</button>
        <button onclick="filterType('expense')" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Expenses</button>
        <button onclick="filterType('income')" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Income</button>
    </div>

    <div id="recurring-list" class="space-y-3">
    </div>

    {% include 'components/empty_state.html' %}
    {% include 'components/modal.html' %}
</div>

<script>
let recurringData = [];
let currentFilter = '';

document.addEventListener('DOMContentLoaded', function() {
    setPageTitle('Recurring Transactions');
    loadRecurring();
});

function filterType(type) {
    currentFilter = type;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active', 'border-primary-600', 'text-primary-600');
        btn.classList.add('border-transparent', 'text-gray-500');
    });
    event.target.classList.add('active', 'border-primary-600', 'text-primary-600');
    event.target.classList.remove('border-transparent', 'text-gray-500');
    renderRecurring();
}

async function loadRecurring() {
    try {
        const result = await api.get('/recurring');
        recurringData = result.data;
        renderRecurring();

        if (recurringData.length === 0) {
            showEmptyState('No recurring transactions', 'Set up recurring expenses and income to automate your tracking.', 'Add Recurring', '/recurring/add');
        } else {
            hideEmptyState();
        }
    } catch (e) {
        showFlash('Failed to load recurring transactions', 'error');
    }
}

function renderRecurring() {
    const list = document.getElementById('recurring-list');
    const filtered = currentFilter ? recurringData.filter(r => r.type === currentFilter) : recurringData;

    list.innerHTML = filtered.map(r => `
        <div class="card p-4 ${r.is_paused ? 'opacity-60' : ''}">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center ${r.type === 'expense' ? 'bg-red-100 dark:bg-red-900/20' : 'bg-green-100 dark:bg-green-900/20'}">
                        ${r.type === 'expense'
                            ? '<svg class="w-5 h-5 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>'
                            : '<svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>'
                        }
                    </div>
                    <div>
                        <h3 class="font-medium text-gray-900 dark:text-white">${escapeHtml(r.title)}</h3>
                        <p class="text-xs text-gray-500">${escapeHtml(r.category_name) || escapeHtml(r.type)} • ${escapeHtml(r.frequency)} • ${escapeHtml(r.payment_method)}</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="font-semibold ${r.type === 'expense' ? 'text-danger' : 'text-success'}">${r.type === 'expense' ? '-' : '+'}${formatCurrency(r.amount)}</p>
                        <p class="text-xs text-gray-500">Next: ${formatDate(r.next_due_date)}</p>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="togglePause(${r.id})" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="${r.is_paused ? 'Resume' : 'Pause'}">
                            ${r.is_paused
                                ? '<svg class="w-4 h-4 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
                                : '<svg class="w-4 h-4 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
                            }
                        </button>
                        <button onclick="skipNext(${r.id})" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="Skip Next">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
                            </svg>
                        </button>
                        <a href="/recurring/${r.id}/edit" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="Edit">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                        </a>
                        <button onclick="deleteRecurring(${r.id})" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/20" title="Delete">
                            <svg class="w-4 h-4 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            ${r.is_paused ? '<div class="mt-2"><span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 dark:bg-yellow-900/20 text-yellow-800 dark:text-yellow-400">Paused</span></div>' : ''}
        </div>
    `).join('');
}

async function togglePause(id) {
    try {
        await api.post(`/recurring/${id}/pause`);
        showFlash('Status updated', 'success');
        loadRecurring();
    } catch (e) {
        showFlash('Failed to update status', 'error');
    }
}

async function skipNext(id) {
    try {
        await api.post(`/recurring/${id}/skip`);
        showFlash('Next occurrence skipped', 'success');
        loadRecurring();
    } catch (e) {
        showFlash('Failed to skip', 'error');
    }
}

async function deleteRecurring(id) {
    confirmAction('Are you sure you want to delete this recurring transaction?', async () => {
        try {
            await api.delete(`/recurring/${id}`);
            showFlash('Recurring transaction deleted', 'success');
            loadRecurring();
        } catch (e) {
            showFlash('Failed to delete', 'error');
        }
    });
}
</script>
{% endblock %}
