{% extends "base_public.html" %}

{% block title %}Server Error - FinanceTrack{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center">
        <div class="w-24 h-24 bg-red-100 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
        </div>
        <h1 class="text-6xl font-bold text-gray-900 dark:text-white mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-2">Server Error</h2>
        <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-md mx-auto">Something went wrong on our end. Please try again later.</p>
        <div class="flex items-center justify-center gap-4">
            <button onclick="location.reload()" class="btn-primary">Try Again</button>
            <a href="/" class="btn-secondary">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
