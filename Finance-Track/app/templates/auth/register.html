{% extends "base_public.html" %}

{% block title %}Create Account - FinanceTrack{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3">
                <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <span class="text-2xl font-bold text-gray-900 dark:text-white">FinanceTrack</span>
            </a>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mt-6">Create your account</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Start managing your finances today</p>
        </div>

        <!-- Registration Form -->
        <div class="card p-6 sm:p-8">
            <form onsubmit="handleRegister(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Full Name</label>
                    <input type="text" name="name" required autocomplete="name" placeholder="John Doe" class="input-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
                    <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" class="input-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
                    <input type="password" name="password" required autocomplete="new-password" placeholder="Create a strong password" class="input-field" oninput="updateStrengthMeter(this.value)">
                    <div class="mt-2">
                        <div class="h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                            <div id="strength-meter" class="h-2 rounded-full transition-all duration-300 w-0"></div>
                        </div>
                        <p id="strength-text" class="text-xs mt-1"></p>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Confirm Password</label>
                    <input type="password" name="confirm_password" required autocomplete="new-password" placeholder="Confirm your password" class="input-field">
                </div>

                <div>
                    <label class="flex items-start gap-2">
                        <input type="checkbox" name="terms" required class="w-4 h-4 mt-0.5 rounded border-gray-300 dark:border-gray-600 text-primary-600 focus:ring-primary-500">
                        <span class="text-sm text-gray-600 dark:text-gray-400">I agree to the <a href="#" class="text-primary-600 hover:text-primary-700">Terms of Service</a> and <a href="#" class="text-primary-600 hover:text-primary-700">Privacy Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary w-full py-3">Create Account</button>
            </form>
        </div>

        <p class="text-center mt-6 text-sm text-gray-600 dark:text-gray-400">
            Already have an account? <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">Sign in</a>
        </p>
    </div>
</div>

<script src="/static/js/auth.js"></script>
{% endblock %}
