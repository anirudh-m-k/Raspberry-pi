{% extends "base.html" %}

{% block title %}Goal Details - FinanceTrack{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="mb-6">
        <a href="/goals" class="text-sm text-primary-600 hover:text-primary-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Goals
        </a>
    </div>

    <!-- Goal Header -->
    <div id="goal-header" class="card p-6">
        <div class="flex items-start justify-between mb-4">
            <div>
                <h1 id="goal-title" class="text-2xl font-bold text-gray-900 dark:text-white"></h1>
                <p id="goal-description" class="text-gray-600 dark:text-gray-400 mt-1"></p>
            </div>
            <span id="goal-priority" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium"></span>
        </div>

        <div class="mb-4">
            <div class="flex items-center justify-between text-sm mb-2">
                <span id="goal-current" class="text-gray-600 dark:text-gray-400"></span>
                <span id="goal-target" class="font-semibold text-gray-900 dark:text-white"></span>
            </div>
            <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                <div id="goal-progress-bar" class="h-4 rounded-full bg-primary-600 transition-all duration-500"></div>
            </div>
            <div class="flex items-center justify-between mt-2">
                <span id="goal-percent" class="text-sm font-medium text-primary-600"></span>
                <span id="goal-deadline" class="text-sm text-gray-500"></span>
            </div>
        </div>

        <div id="goal-actions" class="flex items-center gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
            <button onclick="showContributeModal()" class="btn-primary flex-1">Contribute</button>
            <button onclick="showWithdrawModal()" class="btn-secondary flex-1">Withdraw</button>
            <a id="goal-edit-btn" href="#" class="btn-secondary flex-1 text-center">Edit</a>
            <button onclick="deleteGoal()" class="btn-danger flex-1">Delete</button>
        </div>
    </div>

    <!-- Contributions History -->
    <div class="card overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Contribution History</h2>
        </div>
        <div id="contributions-list">
        </div>
    </div>
</div>

{% include 'components/modal.html' %}

<script>
let goalId = window.location.pathname.split('/')[2];
let goalData = null;

document.addEventListener('DOMContentLoaded', function() {
    setPageTitle('Goal Details');
    loadAccounts();
    loadGoal();
});

async function loadGoal() {
    try {
        const result = await api.get(`/goals/${goalId}`);
        goalData = result.data;
        renderGoal();
    } catch (e) {
        showFlash('Failed to load goal', 'error');
        setTimeout(() => window.location.href = '/goals', 1000);
    }
}

function renderGoal() {
    const g = goalData;
    const progress = g.progress_percent || 0;

    document.getElementById('goal-title').textContent = g.title;
    document.getElementById('goal-description').textContent = g.description || '';
    document.getElementById('goal-current').textContent = `Saved: ${formatCurrency(g.current_amount)}`;
    document.getElementById('goal-target').textContent = `Target: ${formatCurrency(g.target_amount)}`;
    document.getElementById('goal-progress-bar').style.width = `${Math.min(progress, 100)}%`;
    document.getElementById('goal-percent').textContent = `${progress.toFixed(1)}% complete`;
    document.getElementById('goal-deadline').textContent = g.deadline ? `Due: ${formatDate(g.deadline)}` : 'No deadline';

    const priorityEl = document.getElementById('goal-priority');
    const priorityColors = { high: 'bg-red-100 text-red-800 dark:bg-red-900/20 dark:text-red-400', medium: 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/20 dark:text-yellow-400', low: 'bg-green-100 text-green-800 dark:bg-green-900/20 dark:text-green-400' };
    priorityEl.className = `inline-flex items-center px-3 py-1 rounded-full text-xs font-medium ${priorityColors[g.priority] || ''}`;
    priorityEl.textContent = `${g.priority} priority`;

    document.getElementById('goal-edit-btn').href = `/goals/${g.id}/edit`;

    if (g.is_completed) {
        document.getElementById('goal-actions').innerHTML = '<p class="text-center text-success font-medium w-full">Goal Completed!</p>';
    }

    renderContributions(g.contributions || []);
}

function renderContributions(contributions) {
    const list = document.getElementById('contributions-list');
    if (contributions.length === 0) {
        list.innerHTML = '<p class="text-center py-8 text-gray-500">No contributions yet</p>';
        return;
    }

    list.innerHTML = contributions.map(c => `
        <div class="flex items-center justify-between px-6 py-3 border-b border-gray-100 dark:border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center ${c.type === 'withdrawal' ? 'bg-red-100 dark:bg-red-900/20' : 'bg-green-100 dark:bg-green-900/20'}">
                    ${c.type === 'withdrawal'
                        ? '<svg class="w-4 h-4 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>'
                        : '<svg class="w-4 h-4 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>'
                    }
                </div>
                <div>
                    <p class="text-sm text-gray-900 dark:text-white capitalize">${c.type}</p>
                    <p class="text-xs text-gray-500">${formatDate(c.date)}</p>
                </div>
            </div>
            <span class="text-sm font-semibold ${c.type === 'withdrawal' ? 'text-danger' : 'text-success'}">
                ${c.type === 'withdrawal' ? '-' : '+'}${formatCurrency(Math.abs(c.amount))}
            </span>
        </div>
    `).join('');
}

let accountsList = [];

async function loadAccounts() {
    try {
        const result = await api.get('/accounts');
        accountsList = result.data || [];
    } catch (e) {
        accountsList = [];
    }
}

function getAccountOptions() {
    return accountsList.map(a => `<option value="${a.id}">${a.name} (${formatCurrency(a.balance)})</option>`).join('');
}

function showContributeModal() {
    openModal('Contribute to Goal', `
        <form onsubmit="handleContribute(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">From Account</label>
                <select name="account_id" class="input-field">
                    <option value="">Don't deduct from account</option>
                    ${getAccountOptions()}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Amount</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                    <input type="number" name="amount" step="0.01" min="0.01" required placeholder="0.00" class="input-field pl-8">
                </div>
            </div>
            <div class="flex items-center justify-end gap-3">
                <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Contribute</button>
            </div>
        </form>
    `);
}

function showWithdrawModal() {
    openModal('Withdraw from Goal', `
        <form onsubmit="handleWithdraw(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">To Account</label>
                <select name="account_id" class="input-field">
                    <option value="">Don't add to account</option>
                    ${getAccountOptions()}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Amount</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                    <input type="number" name="amount" step="0.01" min="0.01" max="${goalData.current_amount}" required placeholder="0.00" class="input-field pl-8">
                </div>
                <p class="text-xs text-gray-500 mt-1">Max: ${formatCurrency(goalData.current_amount)}</p>
            </div>
            <div class="flex items-center justify-end gap-3">
                <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-danger">Withdraw</button>
            </div>
        </form>
    `);
}

async function handleContribute(e) {
    e.preventDefault();
    try {
        const data = { amount: parseFloat(e.target.amount.value) };
        if (e.target.account_id.value) data.account_id = parseInt(e.target.account_id.value);
        await api.post(`/goals/${goalId}/contribute`, data);
        closeModal();
        showFlash('Contribution added!', 'success');
        loadGoal();
    } catch (error) {
        showFlash(error.error?.message || 'Failed', 'error');
    }
}

async function handleWithdraw(e) {
    e.preventDefault();
    try {
        const data = { amount: parseFloat(e.target.amount.value) };
        if (e.target.account_id.value) data.account_id = parseInt(e.target.account_id.value);
        await api.post(`/goals/${goalId}/withdraw`, data);
        closeModal();
        showFlash('Withdrawal successful!', 'success');
        loadGoal();
    } catch (error) {
        showFlash(error.error?.message || 'Failed', 'error');
    }
}

function deleteGoal() {
    confirmAction('Are you sure you want to delete this goal?', async () => {
        try {
            await api.delete(`/goals/${goalId}`);
            showFlash('Goal deleted', 'success');
            setTimeout(() => window.location.href = '/goals', 500);
        } catch (e) {
            showFlash('Failed to delete goal', 'error');
        }
    });
}
</script>
{% endblock %}
