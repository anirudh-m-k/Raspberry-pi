<!-- Pagination Component -->
<div id="pagination" class="flex items-center justify-between mt-6 hidden">
    <p id="pagination-info" class="text-sm text-gray-600 dark:text-gray-400"></p>
    <div class="flex items-center gap-2">
        <button id="prev-page" onclick="changePage(-1)" class="px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-surface-dark-hover disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Previous
        </button>
        <span id="page-numbers" class="flex items-center gap-1"></span>
        <button id="next-page" onclick="changePage(1)" class="px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-surface-dark-hover disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Next
        </button>
    </div>
</div>

<script>
let currentPage = 1;
let totalPages = 1;

function updatePagination(pagination, loadFunction) {
    currentPage = pagination.page;
    totalPages = pagination.pages;

    const container = document.getElementById('pagination');
    const info = document.getElementById('pagination-info');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const pageNumbers = document.getElementById('page-numbers');

    if (pagination.total === 0) {
        container.classList.add('hidden');
        return;
    }

    container.classList.remove('hidden');
    info.textContent = `Showing ${(pagination.page - 1) * pagination.per_page + 1} to ${Math.min(pagination.page * pagination.per_page, pagination.total)} of ${pagination.total} entries`;
    prevBtn.disabled = pagination.page <= 1;
    nextBtn.disabled = pagination.page >= pagination.pages;

    // Store the load function
    window.loadPage = loadFunction;

    // Page numbers
    let pages = [];
    if (pagination.pages <= 5) {
        for (let i = 1; i <= pagination.pages; i++) pages.push(i);
    } else {
        if (pagination.page <= 3) {
            pages = [1, 2, 3, 4, 5];
        } else if (pagination.page >= pagination.pages - 2) {
            pages = [pagination.pages - 4, pagination.pages - 3, pagination.pages - 2, pagination.pages - 1, pagination.pages];
        } else {
            pages = [pagination.page - 2, pagination.page - 1, pagination.page, pagination.page + 1, pagination.page + 2];
        }
    }

    pageNumbers.innerHTML = pages.map(p => `
        <button onclick="goToPage(${p})" class="w-8 h-8 text-sm rounded-lg ${p === pagination.page ? 'bg-primary-600 text-white' : 'border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-surface-dark-hover text-gray-700 dark:text-gray-300'}">${p}</button>
    `).join('');
}

function changePage(delta) {
    goToPage(currentPage + delta);
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    if (window.loadPage) window.loadPage(page);
}
</script>
