<!-- Flash Messages Component -->
<div id="flash-messages" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm">
</div>

<script>
function showFlash(message, type = 'success') {
    const container = document.getElementById('flash-messages');
    const id = 'flash-' + Date.now();
    const colors = {
        success: 'bg-green-500',
        error: 'bg-danger',
        warning: 'bg-warning',
        info: 'bg-info',
    };
    const icons = {
        success: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>',
        error: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>',
        warning: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>',
        info: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>',
    };

    const flash = document.createElement('div');
    flash.id = id;
    flash.className = `flex items-center gap-3 px-4 py-3 rounded-lg text-white shadow-lg transform transition-all duration-300 translate-x-full ${colors[type]}`;
    flash.innerHTML = `
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">${icons[type]}</svg>
        <span class="text-sm flex-1">${escapeHtml(message)}</span>
        <button onclick="removeFlash('${id}')" class="flex-shrink-0 ml-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    `;

    container.appendChild(flash);
    requestAnimationFrame(() => {
        flash.classList.remove('translate-x-full');
        flash.classList.add('translate-x-0');
    });

    setTimeout(() => removeFlash(id), 5000);
}

function removeFlash(id) {
    const flash = document.getElementById(id);
    if (flash) {
        flash.classList.remove('translate-x-0');
        flash.classList.add('translate-x-full');
        setTimeout(() => flash.remove(), 300);
    }
}
</script>
