<!-- Empty State Component -->
<div id="empty-state" class="hidden text-center py-12">
    <div class="w-16 h-16 bg-gray-100 dark:bg-surface-dark rounded-full flex items-center justify-center mx-auto mb-4">
        <svg id="empty-icon" class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
        </svg>
    </div>
    <h3 id="empty-title" class="text-lg font-medium text-gray-900 dark:text-white mb-2">No data yet</h3>
    <p id="empty-description" class="text-gray-600 dark:text-gray-400 mb-6 max-w-sm mx-auto"></p>
    <a id="empty-action" href="#" class="btn-primary hidden">
        <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span id="empty-action-text">Add</span>
    </a>
</div>

<script>
function showEmptyState(title, description, actionText, actionHref) {
    const container = document.getElementById('empty-state');
    container.classList.remove('hidden');
    document.getElementById('empty-title').textContent = title;
    document.getElementById('empty-description').textContent = description;

    const action = document.getElementById('empty-action');
    if (actionText && actionHref) {
        action.classList.remove('hidden');
        action.href = actionHref;
        document.getElementById('empty-action-text').textContent = actionText;
    } else {
        action.classList.add('hidden');
    }
}

function hideEmptyState() {
    document.getElementById('empty-state').classList.add('hidden');
}
</script>
