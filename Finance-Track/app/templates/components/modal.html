<!-- Modal Component -->
<div id="modal-overlay" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeModal()"></div>
    <div class="relative flex items-center justify-center min-h-screen p-4">
        <div id="modal-content" class="relative bg-white dark:bg-surface-dark-card rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                <h3 id="modal-title" class="text-lg font-semibold text-gray-900 dark:text-white"></h3>
                <button onclick="closeModal()" class="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="modal-body" class="p-6"></div>
        </div>
    </div>
</div>

<script>
let _pendingConfirmCallback = null;

function openModal(title, content) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = content;
    document.getElementById('modal-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
    document.body.style.overflow = '';
    _pendingConfirmCallback = null;
}

function confirmAction(message, onConfirm) {
    _pendingConfirmCallback = onConfirm;
    openModal('Confirm', `
        <p class="text-gray-600 dark:text-gray-400 mb-6">${message}</p>
        <div class="flex items-center justify-end gap-3">
            <button onclick="closeModal()" class="btn-secondary">Cancel</button>
            <button onclick="executeConfirm()" class="btn-danger">Confirm</button>
        </div>
    `);
}

function executeConfirm() {
    const cb = _pendingConfirmCallback;
    closeModal();
    if (typeof cb === 'function') {
        cb();
    }
}
</script>
