<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinanceTrack{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        // Apply theme immediately
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        // Redirect to login if no token
        (function() {
            const token = localStorage.getItem('token');
            if (!token && !window.location.pathname.match(/^\/(login|register|forgot-password|)$/)) {
                window.location.href = '/login';
            }
        })();
    </script>
</head>
<body class="bg-gray-50 dark:bg-surface-dark text-gray-900 dark:text-gray-100 font-sans antialiased">
    {% include 'components/sidebar.html' %}
    {% include 'components/topbar.html' %}
    {% include 'components/flash_messages.html' %}

    <main class="lg:ml-64 pt-16 min-h-screen">
        <div class="p-4 lg:p-6">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/api.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
