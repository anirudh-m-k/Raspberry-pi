{% extends "base.html" %}

{% block title %}Budget Details - FinanceTrack{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="mb-6">
        <a href="/budgets" class="text-sm text-primary-600 hover:text-primary-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Budgets
        </a>
    </div>

    <!-- Budget Header -->
    <div class="card p-6">
        <div class="flex items-start justify-between mb-4">
            <div class="flex items-center gap-3">
                <div id="budget-icon" class="w-12 h-12 rounded-xl flex items-center justify-center bg-primary-500">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div>
                    <h1 id="budget-category" class="text-2xl font-bold text-gray-900 dark:text-white"></h1>
                    <p id="budget-period" class="text-gray-600 dark:text-gray-400 mt-1"></p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-4">
            <div>
                <p class="text-xs text-gray-500 uppercase tracking-wide">Budget</p>
                <p id="budget-amount" class="text-xl font-bold text-gray-900 dark:text-white mt-1"></p>
            </div>
            <div>
                <p class="text-xs text-gray-500 uppercase tracking-wide">Spent</p>
                <p id="budget-spent" class="text-xl font-bold text-danger mt-1"></p>
            </div>
            <div>
                <p class="text-xs text-gray-500 uppercase tracking-wide">Remaining</p>
                <p id="budget-remaining" class="text-xl font-bold text-success mt-1"></p>
            </div>
        </div>

        <div class="mb-4">
            <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span>Progress</span>
                <span id="budget-utilization"></span>
            </div>
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
                <div id="budget-progress-bar" class="h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex items-center gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
            <a id="budget-edit-btn" href="#" class="btn-secondary flex-1 text-center">Edit</a>
            <button onclick="deleteBudget()" class="btn-danger flex-1">Delete</button>
        </div>
    </div>

    <!-- Tabs: Transactions | History -->
    <div class="card overflow-hidden">
        <div class="flex border-b border-gray-200 dark:border-gray-700">
            <button onclick="switchTab('transactions')" id="tab-transactions" class="flex-1 px-4 py-3 text-sm font-medium text-center border-b-2 border-primary-600 text-primary-600 dark:text-primary-400 dark:border-primary-400 transition-colors">
                Transactions
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 px-4 py-3 text-sm font-medium text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
                History
            </button>
        </div>

        <!-- Transactions Tab -->
        <div id="panel-transactions">
            <div id="transactions-list"></div>
            <div id="tx-load-more" class="text-center py-3 hidden border-t border-gray-200 dark:border-gray-700">
                <button onclick="loadMoreTransactions()" class="text-sm text-primary-600 hover:text-primary-700 font-medium">Load More</button>
            </div>
        </div>

        <!-- History Tab -->
        <div id="panel-history" class="hidden">
            <div id="history-list"></div>
        </div>
    </div>
</div>

{% include 'components/modal.html' %}

<script>
let budgetId = window.location.pathname.split('/')[2];
let budgetData = null;
let txPage = 1;
let txHasNext = false;
let activeTab = 'transactions';

document.addEventListener('DOMContentLoaded', function() {
    setPageTitle('Budget Details');
    loadBudget();
});

function switchTab(tab) {
    activeTab = tab;

    // Update tab styles
    const tabTransactions = document.getElementById('tab-transactions');
    const tabHistory = document.getElementById('tab-history');
    const panelTransactions = document.getElementById('panel-transactions');
    const panelHistory = document.getElementById('panel-history');

    if (tab === 'transactions') {
        tabTransactions.className = 'flex-1 px-4 py-3 text-sm font-medium text-center border-b-2 border-primary-600 text-primary-600 dark:text-primary-400 dark:border-primary-400 transition-colors';
        tabHistory.className = 'flex-1 px-4 py-3 text-sm font-medium text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors';
        panelTransactions.classList.remove('hidden');
        panelHistory.classList.add('hidden');
    } else {
        tabHistory.className = 'flex-1 px-4 py-3 text-sm font-medium text-center border-b-2 border-primary-600 text-primary-600 dark:text-primary-400 dark:border-primary-400 transition-colors';
        tabTransactions.className = 'flex-1 px-4 py-3 text-sm font-medium text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors';
        panelHistory.classList.remove('hidden');
        panelTransactions.classList.add('hidden');
        loadHistory();
    }
}

async function loadBudget() {
    try {
        const result = await api.get(`/budgets/${budgetId}`);
        budgetData = result.data;
        renderBudget();
        loadTransactions(1);
    } catch (e) {
        showFlash('Failed to load budget', 'error');
        setTimeout(() => window.location.href = '/budgets', 1000);
    }
}

function renderBudget() {
    const b = budgetData;
    const category = b.category_name || 'Overall Budget';
    const period = b.period === 'monthly' ? 'Monthly' : 'Weekly';

    document.getElementById('budget-category').textContent = category;
    document.getElementById('budget-period').textContent = `${period} Budget`;
    document.getElementById('budget-amount').textContent = formatCurrency(b.budget);
    document.getElementById('budget-spent').textContent = formatCurrency(b.spent);

    const remaining = b.remaining;
    const remainingEl = document.getElementById('budget-remaining');
    remainingEl.textContent = formatCurrency(remaining);
    remainingEl.className = `text-xl font-bold mt-1 ${remaining >= 0 ? 'text-success' : 'text-danger'}`;

    const util = b.utilization;
    document.getElementById('budget-utilization').textContent = `${util}%`;
    const progressBar = document.getElementById('budget-progress-bar');
    progressBar.style.width = `${Math.min(util, 100)}%`;
    if (util >= 100) {
        progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-danger';
    } else if (util >= (b.alert_threshold || 80)) {
        progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-warning';
    } else {
        progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-primary-600';
    }

    document.getElementById('budget-edit-btn').href = `/budgets/${b.id}/edit`;
}

async function loadTransactions(page) {
    try {
        const result = await api.get(`/budgets/${budgetId}/transactions?page=${page}&per_page=20`);
        renderTransactions(result.data, page > 1);
    } catch (e) {
        document.getElementById('transactions-list').innerHTML = '<p class="text-center py-8 text-gray-500">Failed to load transactions</p>';
    }
}

function renderTransactions(data, append) {
    const list = document.getElementById('transactions-list');
    const loadMore = document.getElementById('tx-load-more');

    if (!append) list.innerHTML = '';

    if (!data.transactions || data.transactions.length === 0) {
        if (!append) list.innerHTML = '<p class="text-center py-8 text-gray-500">No transactions found</p>';
        loadMore.classList.add('hidden');
        return;
    }

    const html = data.transactions.map(t => `
        <div class="flex items-center justify-between px-6 py-3 border-b border-gray-100 dark:border-gray-800">
            <div>
                <p class="text-sm text-gray-900 dark:text-white">${escapeHtml(t.notes || t.category)}</p>
                <p class="text-xs text-gray-500">${formatDate(t.date)}${t.notes ? ' — ' + escapeHtml(t.category) : ''}</p>
            </div>
            <span class="text-sm font-semibold text-danger">
                -${formatCurrency(t.amount)}
            </span>
        </div>
    `).join('');

    if (append) {
        list.insertAdjacentHTML('beforeend', html);
    } else {
        list.innerHTML = html;
    }

    txHasNext = data.has_next;
    txPage = data.page;
    if (data.has_next) {
        loadMore.classList.remove('hidden');
    } else {
        loadMore.classList.add('hidden');
    }
}

async function loadMoreTransactions() {
    const loadMore = document.getElementById('tx-load-more');
    loadMore.innerHTML = '<p class="text-gray-500 text-sm">Loading...</p>';

    try {
        const nextPage = txPage + 1;
        const result = await api.get(`/budgets/${budgetId}/transactions?page=${nextPage}&per_page=20`);
        renderTransactions(result.data, true);
        loadMore.innerHTML = '<button onclick="loadMoreTransactions()" class="text-sm text-primary-600 hover:text-primary-700 font-medium">Load More</button>';
    } catch (e) {
        loadMore.innerHTML = '<p class="text-red-500 text-sm">Failed to load</p>';
    }
}

async function loadHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '<p class="text-center py-8 text-gray-500">Loading...</p>';

    try {
        const result = await api.get(`/budgets/${budgetId}/history?months=6`);
        renderHistory(result.data);
    } catch (e) {
        list.innerHTML = '<p class="text-center py-8 text-gray-500">Failed to load history</p>';
    }
}

function renderHistory(data) {
    const list = document.getElementById('history-list');

    if (!data.history || data.history.length === 0) {
        list.innerHTML = '<p class="text-center py-8 text-gray-500">No history available yet</p>';
        return;
    }

    const html = data.history.map(h => {
        const util = h.utilization;
        let barColor = 'bg-primary-600';
        let textColor = 'text-success';
        if (util >= 100) {
            barColor = 'bg-danger';
            textColor = 'text-danger';
        } else if (util >= 80) {
            barColor = 'bg-warning';
            textColor = 'text-warning';
        }

        return `
            <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-medium text-gray-900 dark:text-white">${escapeHtml(h.label)}</span>
                    <span class="text-sm font-semibold ${textColor}">${util}%</span>
                </div>
                <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mb-2">
                    <div class="${barColor} h-2 rounded-full transition-all duration-300" style="width: ${Math.min(util, 100)}%"></div>
                </div>
                <div class="flex justify-between text-xs text-gray-500">
                    <span>Budget: ${formatCurrency(h.budgeted)}</span>
                    <span>Spent: ${formatCurrency(h.spent)}</span>
                    <span class="${textColor}">${h.remaining >= 0 ? 'Left: ' + formatCurrency(h.remaining) : 'Over: ' + formatCurrency(Math.abs(h.remaining))}</span>
                </div>
            </div>
        `;
    }).join('');

    list.innerHTML = html;
}

function deleteBudget() {
    openModal('Delete Budget', `
        <p class="text-gray-600 dark:text-gray-400 mb-4">Are you sure you want to delete this budget?</p>
        <div class="flex items-center justify-end gap-3">
            <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
            <button type="button" onclick="executeDeleteBudget()" class="btn-danger">Delete</button>
        </div>
    `);
}

async function executeDeleteBudget() {
    try {
        await api.delete(`/budgets/${budgetId}`);
        closeModal();
        showFlash('Budget deleted', 'success');
        setTimeout(() => window.location.href = '/budgets', 500);
    } catch (e) {
        showFlash('Failed to delete budget', 'error');
    }
}
</script>
{% endblock %}
