{% extends "base.html" %}

{% block title %}Edit Budget - FinanceTrack{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="/budgets" class="text-sm text-primary-600 hover:text-primary-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Budgets
        </a>
    </div>

    <div class="card p-6 sm:p-8">
        <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-6">Edit Budget</h1>

        <form onsubmit="handleSubmit(event)" class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Category</label>
                    <select name="category_id" class="input-field">
                        <option value="">Overall Budget (All Categories)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Period *</label>
                    <select name="period" required class="input-field">
                        <option value="monthly">Monthly</option>
                        <option value="weekly">Weekly</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Budget Amount *</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                        <input type="number" name="amount" step="0.01" min="0.01" required placeholder="0.00" class="input-field pl-8 text-lg font-semibold">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Alert Threshold (%)</label>
                    <input type="number" name="alert_threshold" value="80" min="1" max="100" class="input-field">
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <a href="/budgets" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">
                    <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Update Budget
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let budgetId = window.location.pathname.split('/')[2];

document.addEventListener('DOMContentLoaded', async function() {
    setPageTitle('Edit Budget');
    await loadCategories();
    await loadBudget();
});

async function loadCategories() {
    try {
        const result = await api.get('/settings/categories', { type: 'expense' });
        const select = document.querySelector('select[name="category_id"]');
        result.data.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.name;
            select.appendChild(opt);
        });
    } catch (e) {}
}

async function loadBudget() {
    try {
        const result = await api.get(`/budgets/${budgetId}`);
        const budget = result.data;
        const form = document.getElementById('budget-form') || document.querySelector('form');
        form.amount.value = budget.amount;
        form.period.value = budget.period;
        form.alert_threshold.value = budget.alert_threshold;
        if (budget.category_id) form.category_id.value = budget.category_id;
    } catch (e) {
        showFlash('Failed to load budget', 'error');
        setTimeout(() => window.location.href = '/budgets', 1000);
    }
}

async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    try {
        await api.put(`/budgets/${budgetId}`, {
            category_id: form.category_id.value || null,
            period: form.period.value,
            amount: parseFloat(form.amount.value),
            alert_threshold: parseInt(form.alert_threshold.value),
        });
        showFlash('Budget updated!', 'success');
        setTimeout(() => window.location.href = '/budgets', 500);
    } catch (error) {
        showFlash(error.error?.message || 'Failed to update', 'error');
    }
}
</script>
{% endblock %}
