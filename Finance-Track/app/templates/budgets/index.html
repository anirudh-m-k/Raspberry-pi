{% extends "base.html" %}

{% block title %}Budgets - FinanceTrack{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Budgets</h1>
            <p class="text-gray-600 dark:text-gray-400 text-sm">Set and track your spending limits</p>
        </div>
        <a href="/budgets/add" class="btn-primary">
            <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Budget
        </a>
    </div>

    <div id="budgets-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
    </div>

    {% include 'components/empty_state.html' %}
    {% include 'components/modal.html' %}
</div>

<script>
let budgetsData = [];

document.addEventListener('DOMContentLoaded', function() {
    setPageTitle('Budgets');
    loadBudgets();
});

async function loadBudgets() {
    try {
        const result = await api.get('/budgets');
        budgetsData = result.data;
        renderBudgets();

        if (budgetsData.length === 0) {
            showEmptyState('No budgets set', 'Create budgets to control your spending by category.', 'Add Budget', '/budgets/add');
        } else {
            hideEmptyState();
        }
    } catch (e) {
        showFlash('Failed to load budgets', 'error');
    }
}

function renderBudgets() {
    const list = document.getElementById('budgets-list');

    list.innerHTML = budgetsData.map(b => {
        const utilization = b.utilization || 0;
        const color = utilization >= 100 ? 'bg-danger' : utilization >= b.alert_threshold ? 'bg-warning' : 'bg-success';
        const textColor = utilization >= 100 ? 'text-danger' : utilization >= b.alert_threshold ? 'text-warning' : 'text-success';

        return `
            <div class="card p-5">
                <div class="flex items-start justify-between mb-4">
                    <div>
                        <h3 class="font-semibold text-gray-900 dark:text-white">${escapeHtml(b.category_name) || 'Overall'}</h3>
                        <p class="text-xs text-gray-500 capitalize">${escapeHtml(b.period)} budget</p>
                    </div>
                    <div class="flex items-center gap-1">
                        <a href="/budgets/${b.id}" class="btn-secondary text-xs py-1.5 px-3 flex-1">View</a>
                        <a href="/budgets/${b.id}/edit" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-surface-dark-hover" title="Edit">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                        </a>
                        <button onclick="deleteBudget(${b.id})" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/20" title="Delete">
                            <svg class="w-4 h-4 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="flex items-center justify-between text-sm mb-1">
                        <span class="text-gray-600 dark:text-gray-400">Spent: ${formatCurrency(b.spent || 0)}</span>
                        <span class="font-medium text-gray-900 dark:text-white">${formatCurrency(b.amount)}</span>
                    </div>
                    <div class="h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                        <div class="h-2 rounded-full ${color} transition-all duration-300" style="width: ${Math.min(utilization, 100)}%"></div>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-sm ${textColor} font-medium">${utilization.toFixed(0)}% used</span>
                    <span class="text-sm text-gray-500">Remaining: ${formatCurrency(b.remaining || 0)}</span>
                </div>

                ${utilization >= b.alert_threshold ? `
                    <div class="mt-3 p-2 rounded-lg bg-yellow-50 dark:bg-yellow-900/10 border border-yellow-200 dark:border-yellow-800">
                        <p class="text-xs text-yellow-800 dark:text-yellow-400">
                            ${utilization >= 100 ? 'Budget exceeded!' : 'Approaching budget limit'}
                        </p>
                    </div>
                ` : ''}
            </div>
        `;
    }).join('');
}

async function deleteBudget(id) {
    confirmAction('Are you sure you want to delete this budget?', async () => {
        try {
            await api.delete(`/budgets/${id}`);
            showFlash('Budget deleted', 'success');
            loadBudgets();
        } catch (e) {
            showFlash('Failed to delete budget', 'error');
        }
    });
}
</script>
{% endblock %}
